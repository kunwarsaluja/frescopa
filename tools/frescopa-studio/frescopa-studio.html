<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frescopa Studio</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles/fonts.css">
  <link rel="stylesheet" href="/tools/frescopa-studio/frescopa-studio.css">
  <!-- DA App SDK: https://docs.da.live/developers/guides/developing-apps-and-plugins -->
  <script src="https://da.live/nx/utils/sdk.js" type="module"></script>
  <script src="/tools/frescopa-studio/frescopa-studio.js" type="module"></script>
</head>
<body>
  <header class="studio-bar">
    <h1>Frescopa Studio</h1>
    <p class="studio-status" id="status" role="status"></p>
    <a class="studio-link" id="open-in-da" target="_blank" rel="noopener">Open in DA</a>
    <button class="studio-button" id="preview" type="button" disabled>Preview</button>
    <button class="studio-button primary" id="publish" type="button" disabled>Publish</button>
  </header>
  <main class="studio">
    <form class="studio-form" id="form" novalidate></form>
    <section class="studio-phone" aria-label="App preview">
      <iframe id="phone" title="Frescopa app with your changes" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
      <p class="studio-phone-note" id="phone-note"></p>
    </section>
  </main>
</body>
</html>
